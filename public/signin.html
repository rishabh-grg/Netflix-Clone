<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Netflix Clone</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="signin-page">

    <nav>
        <a href="index.html">
            <img src="Assets/Images/Logo.svg"
                 alt="Netflix Logo"
                 width="150">
        </a>
    </nav>

    <hr>

    <main>
        <h1>Enter your info to sign in</h1>
        <p>Or get started with a new account.</p>

        <form action="/continue" method="POST" id="signinForm">
            <input
                type="text"
                id="email"
                name="email"
                placeholder="Email or mobile number"
                required
            >

            <button type="submit">Continue</button>
        </form>

        <a href="#">Get Help</a>
    </main>

    <footer>
        <p>Questions? Call 000-800-919-1743 (Toll-Free)</p>

        <a href="https://help.netflix.com/">FAQ</a>
        <a href="https://help.netflix.com/">Help Centre</a>
        <a href="#">Terms of Use</a>
        <a href="#">Privacy</a>
        <a href="#">Cookie Preferences</a>
        <a href="#">Corporate Information</a>

        <p>Select language</p>
    </footer>

</body>
</html>
